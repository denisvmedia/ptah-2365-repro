name: reproduce

on:
  push:
    branches: [main, codex/2365-minimal-reproducer]
  workflow_dispatch:

permissions:
  contents: read

env:
  CGO_ENABLED: '0'
  GOAMD64: v1
  GOENV: 'off'
  GOEXPERIMENT: ''
  GOFLAGS: ''
  GOTOOLCHAIN: local
  GOWORK: 'off'
  GODEBUG: adaptivestackstart=0
  GOGC: 'off'
  GOMEMLIMIT: 'off'
  GOTRACEBACK: system

jobs:
  reproduce:
    runs-on: windows-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        attempt: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version: 1.27.0
          cache: false
      - name: Build and run
        shell: pwsh
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandArgumentPassing = 'Standard'

          & go build -trimpath -buildvcs=false -o repro.exe .
          if ($LASTEXITCODE -ne 0) { throw 'build failed' }

          function Invoke-Repro($mode) {
            $ErrorActionPreference = 'Continue'
            & .\repro.exe $mode 2> "$mode.log"
            $code = $LASTEXITCODE
            $ErrorActionPreference = 'Stop'
            $code | Set-Content "$mode.exit"
          }

          function Test-Clean($text, $code) {
            $tail = [regex]::Match(
              $text,
              'REPRO_TAIL before=([0-9a-f]{64}) after=([0-9a-f]{64})'
            )
            return $code -eq '0' -and
              $text -match 'REPRO_RESULT clean' -and
              $tail.Success -and
              $tail.Groups[1].Value -eq $tail.Groups[2].Value
          }

          function Test-Exact($text, $code) {
            $pair = [regex]::Match($text, 'REPRO_PAIR span=([0-9]+) stack_lo=([0-9]+)')
            $tail = [regex]::Match(
              $text,
              'REPRO_TAIL before=([0-9a-f]{64}) after=([0-9a-f]{64})'
            )
            $header = [regex]::Matches(
              $text,
              '(?m)^runtime: marked free object in span 0x[0-9a-f]+, elemsize=16 .*$'
            )
            $fatal = [regex]::Matches(
              $text,
              '(?m)^fatal error: found pointer to free object\r?$'
            )
            $stack = [regex]::Matches(
              $text,
              '(?m)^runtime\.\(\*mspan\)\.reportZombies\(.*$'
            )
            if ($code -ne '2' -or -not $pair.Success -or -not $tail.Success -or
                $header.Count -ne 1 -or $fatal.Count -ne 1 -or $stack.Count -ne 1 -or
                $tail.Index -ge $header[0].Index -or $header[0].Index -ge $fatal[0].Index) {
              return $false
            }

            $span = [UInt64]$pair.Groups[1].Value
            $stackLo = [UInt64]$pair.Groups[2].Value
            $before = $tail.Groups[1].Value
            $after = $tail.Groups[2].Value
            if ($stackLo -ne $span + 8192 -or
                $before -ne (('0' * 62) + '04') -or $after -eq $before) {
              return $false
            }
            $bytes = [Convert]::FromHexString($after)
            if ([BitConverter]::ToUInt64($bytes, 8) -ne $stackLo + 0x48 -or
                [BitConverter]::ToUInt64($bytes, 24) -ne $stackLo + 0x20) {
              return $false
            }

            $rows = [regex]::Matches(
              $text,
              '(?m)^0x([0-9a-f]+) (?:free|alloc)\s+(?:marked|unmarked)(?:\s+zombie)?\r?$'
            )
            if ($rows.Count -ne 496) { return $false }
            for ($index = 0; $index -lt $rows.Count; $index++) {
              $address = [Convert]::ToUInt64($rows[$index].Groups[1].Value, 16)
              if ($address -ne $span + 16 * $index) { return $false }
            }
            return $true
          }

          Invoke-Repro panic
          Invoke-Repro fault
          $panicCode = (Get-Content panic.exit -Raw).Trim()
          $panicText = Get-Content panic.log -Raw
          $faultCode = (Get-Content fault.exit -Raw).Trim()
          $faultText = Get-Content fault.log -Raw

          if (-not (Test-Clean $panicText $panicCode)) {
            'REFUSED panic control' | Set-Content verdict.txt
            exit 1
          }
          if (Test-Exact $faultText $faultCode) {
            'EXACT' | Set-Content verdict.txt
            exit 1
          }
          if (Test-Clean $faultText $faultCode) {
            'CLEAN' | Set-Content verdict.txt
            exit 0
          }
          "REFUSED fault=$faultCode" | Set-Content verdict.txt
          exit 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: repro-${{ matrix.attempt }}
          path: |
            *.log
            *.exit
            verdict.txt
          if-no-files-found: error
