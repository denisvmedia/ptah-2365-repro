# The sweeper's zombie report is blind under the default collector, and that is
# why every crash dump collected for stokaro/ptah#2365 carried no evidence.
#
# This job is not a search for the rare fault. It is a deterministic measurement
# that finishes in seconds, and it runs on three operating systems because the
# defect is in the runtime's reporting logic rather than in anything a platform
# contributes -- so a result from one platform alone would leave the reader
# guessing whether the windows/amd64 dumps were a Windows story.
name: zombie report

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  measure:
    name: zombie report (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Measure what the report names
        run: go test -v -count=1 ./zombiereport/...
